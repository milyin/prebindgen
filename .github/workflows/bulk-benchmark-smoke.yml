name: Collection benchmark smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
      - run: python3 examples/bench-bulk/run.py --output /tmp/bulk-smoke --fetch --check-generated --check-jni --jvms 2 --warmup 1 --batches 1 --target-ms 2
        env:
          KOTLINC: /tmp/kotlin/kotlinc/bin/kotlinc
      - run: python3 examples/bench-c-collections/build.py --output /tmp/c-rows-smoke --fetch --count-allocations --check-generated
      - run: python3 examples/bench-c-collections/compare.py --before /tmp/c-rows-smoke --after /tmp/c-rows-smoke --output /tmp/c-rows-check --kind count --smoke --forks 1
      - run: python3 examples/bench-c-collections/input-compare.py --before /tmp/c-rows-smoke --after /tmp/c-rows-smoke --output /tmp/c-input-check --kind count --smoke --forks 1
      - run: python3 examples/bench-input-aliases/call-wide/build.py --output /tmp/c-alias-preflight --target-dir /tmp/c-alias-preflight-target
      - run: python3 examples/bench-input-aliases/call-wide/study.py --build /tmp/c-alias-preflight --output /tmp/c-alias-preflight-check --verify-only
      - run: python3 examples/bench-input-aliases/type-buckets/build.py --output /tmp/type-buckets --target-dir /tmp/c-alias-preflight-target --no-count
      - run: python3 examples/bench-input-aliases/type-buckets/kotlin.py --build /tmp/type-buckets --kotlinc /tmp/kotlin/kotlinc/bin/kotlinc
      - run: python3 examples/bench-input-aliases/type-buckets/measure.py --build /tmp/type-buckets --output /tmp/type-buckets-check --only checks
      - run: java -Xss64m -Djava.library.path=/tmp/type-buckets/current-time -cp /tmp/type-buckets/paired.jar PairedKt 8 ascending 0 1 1
