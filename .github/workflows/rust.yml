name: Converter pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.rust }} --component clippy --component rustfmt
      - run: cargo +${{ matrix.rust }} test --workspace
      - run: cargo +${{ matrix.rust }} clippy --workspace --all-targets -- -D warnings
      - if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      # Documents the published crates in dependency order, then checks the
      # rendered links: rustdoc does not warn when a link into another crate
      # fails to resolve. The Pages workflows build the site with this script.
      - if: matrix.rust == 'stable'
        run: ./site/build.sh site-build
        env:
          RUSTDOCFLAGS: -D warnings
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
      - run: cargo build --workspace
      - run: python3 examples/record-generated.py --check
      - run: python3 examples/check.py
        env:
          KOTLINC: /tmp/kotlin/kotlinc/bin/kotlinc
          SANITIZE: "1"

  opaque-layouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: cargo fetch
      - run: python3 examples/check-opaque-layouts.py --target aarch64-unknown-linux-gnu --target i686-unknown-linux-gnu
