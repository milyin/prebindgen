[package]
name = "prebindgen-c"
version = { workspace = true }
edition = { workspace = true }
description = "Experimental C / cbindgen binding generator for prebindgen"
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
rust-version = { workspace = true }

[features]
# Compile the experimental v2 engine alongside v1 and make it selectable.
# Additive: it enables the optional dependency and nothing else. V1 stays the
# engine an unset `PREBINDGEN_PIPELINE` selects, `--all-features` included.
v2 = ["dep:prebindgen-registry-v2"]

[dependencies]
prebindgen = { workspace = true }
prebindgen-registry = { workspace = true }
prebindgen-registry-v2 = { workspace = true, optional = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# The registry's test support: `RustWriter::for_registry_test` and
# `assert_edges_cover_rendered_calls`, which every binding these tests build
# runs through.
prebindgen-registry = { workspace = true, features = ["testing"] }
