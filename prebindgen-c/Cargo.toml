[package]
name = "prebindgen-c"
version = { workspace = true }
edition = { workspace = true }
description = "Experimental C / cbindgen binding generator for prebindgen"
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
rust-version = { workspace = true }

[dependencies]
prebindgen = { workspace = true }
prebindgen-registry = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# The registry's test support: `RustWriter::for_registry_test` and
# `assert_edges_cover_rendered_calls`, which every binding these tests build
# runs through.
prebindgen-registry = { workspace = true, features = ["testing"] }
