[workspace]
members = [
    "prebindgen",
    "prebindgen-flat",
    "prebindgen-registry",
    "prebindgen-c",
    "prebindgen-jni",
    "prebindgen-proc-macro",
    "prebindgen-jni-runtime",
    "prebindgen-c-runtime",
    "examples/example-cbindgen",
    "examples/example-flat",
    "examples/perftest-flat",
    "examples/perftest-c",
    "examples/perftest-kotlin",
    "examples/covertest-helpers",
    "examples/covertest-kotlin",
    "examples/emitcheck",
]
resolver = "2"
package.version = "0.5.0"
package.edition = "2021"
package.rust-version = "1.85"
package.license = "MIT OR Apache-2.0"
package.authors = ["Michael Ilyin <milyin@gmail.com>"]
package.repository = "https://github.com/milyin/prebindgen"
package.documentation = "https://docs.rs/prebindgen"
package.readme = "README.md"
package.keywords = ["ffi", "bindings", "cbindgen", "csbindgen", "cross-platform"]
package.categories = ["development-tools", "external-ffi-bindings"] 

[workspace.dependencies]
# TEMPORARY: 0.3.0 (`KtClass::ctor_vis`, `KtFile::file_annotation`) is not on
# crates.io yet — milyin/kotlin-codegen#23. `version` alongside `git` is what
# keeps `cargo package` working and is what a published prebindgen would carry.
# Drop the git/branch keys once 0.3.0 is released; the branch disappears on
# merge, so CI will say so.
kotlin-codegen = { version = "0.3.0", git = "https://github.com/milyin/kotlin-codegen.git", branch = "ctor-vis-and-file-annotations" }
prebindgen = { path = "prebindgen", version = "0.5.0" }
prebindgen-flat = { path = "prebindgen-flat", version = "0.5.0" }
prebindgen-registry = { path = "prebindgen-registry", version = "0.5.0" }
prebindgen-c = { path = "prebindgen-c", version = "0.5.0" }
prebindgen-jni = { path = "prebindgen-jni", version = "0.5.0" }
prebindgen-proc-macro = { path = "prebindgen-proc-macro", version = "0.5.0" }
prebindgen-jni-runtime = { path = "prebindgen-jni-runtime", version = "0.5.0" }
prebindgen-c-runtime = { path = "prebindgen-c-runtime", version = "0.5.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit-mut", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
regex = "1.0"
prettyplease = "0.2"
roxygen = "1.0.4"
tempfile = "3.0"
itertools = "0.14.0"
if_rust_version = "1.0"
konst = "0.3.0" # consumer crates need konst too: the generated file emits a konst::assertc_eq! guard
toml = "0.9.5"
