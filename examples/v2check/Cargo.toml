[package]
name = "v2check"
version = { workspace = true }
edition = { workspace = true }
build = "build.rs"
publish = false

[lib]
name = "v2check"

[dependencies]
# What the generated JNI wrapper calls at run time. The C wrapper calls nothing
# but the source module.
jni = "0.21.1"

[dev-dependencies]
# The tests compare emitted items with the ones the specification pages show,
# which means parsing both rather than diffing text.
syn = { workspace = true }
quote = { workspace = true }

[build-dependencies]
prebindgen = { workspace = true }
prebindgen-registry-v2 = { workspace = true }
prebindgen-flat = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
