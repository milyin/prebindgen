[package]
name = "v2check"
version = { workspace = true }
edition = { workspace = true }
build = "build.rs"
publish = false

[lib]
name = "v2check"

[dependencies]
# What the generated JNI wrapper calls at run time. The C wrapper calls nothing
# but the source module.
jni = "0.21.1"

[dev-dependencies]
# The tests compare emitted items with the ones the specification pages show,
# which means parsing both rather than diffing text.
syn = { workspace = true }
quote = { workspace = true }
# One test runs the frontend again, with a class renamed, which needs what the
# build script needs.
prebindgen = { workspace = true }
prebindgen-jni = { workspace = true, features = ["v2"] }
# `fun!` for the JNI declarations lives in the registry crate, as it does for
# every JNI binding.
prebindgen-registry = { workspace = true }

[build-dependencies]
# The real frontends, with the v2 engine compiled in: this crate declares its
# binding the way any consumer does, and states the engine rather than reading
# `PREBINDGEN_PIPELINE`.
prebindgen = { workspace = true }
prebindgen-c = { workspace = true, features = ["v2"] }
prebindgen-jni = { workspace = true, features = ["v2"] }
prebindgen-registry = { workspace = true }
syn = { workspace = true }
