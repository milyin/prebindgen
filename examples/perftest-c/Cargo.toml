[package]
name = "perftest-c"
version = { workspace = true }
edition = { workspace = true }
build = "build.rs"

[features]
# Forward `prebindgen-c`'s v2 engine feature, so `PREBINDGEN_PIPELINE=v2` has
# an engine to select. Additive: enabling it does not change what an unset
# selector generates.
v2 = ["prebindgen-c/v2"]

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
prebindgen = { workspace = true }
prebindgen-c-runtime = { workspace = true }
perftest-flat = { path = "../perftest-flat" }
konst = "0.3.0"

[build-dependencies]
prebindgen = { workspace = true }
prebindgen-c = { workspace = true }
syn = { workspace = true }
cbindgen = "=0.29.4"
perftest-flat = { path = "../perftest-flat" }
